<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lugares increíbles de Colombia</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body id="inicio">
    <header>
      <h1>Lugares increíbles de Colombia</h1>

      <p>
        Colombia cuenta con paisajes naturales, ciudades históricas y destinos
        llenos de diversidad. Esta galería presenta algunos lugares que vale la
        pena conocer.
      </p>
    </header>

    <main class="galeria">
      <figure>
        <img
          src="images/cartagena.jpg"
          alt="Casas coloniales coloridas en el centro histórico de Cartagena"
        />
        <figcaption>
          <h2>Cartagena</h2>
          <p>
            Una ciudad costera reconocida por sus murallas, calles coloniales y
            arquitectura llena de color.
          </p>
        </figcaption>
      </figure>

      <figure>
        <img
          src="images/guatape.jpg"
          alt="Vista de las montañas y el embalse de Guatapé"
        />
        <figcaption>
          <h2>Guatapé</h2>
          <p>
            Sus paisajes, el embalse y la Piedra del Peñol convierten a Guatapé
            en un destino inolvidable.
          </p>
        </figcaption>
      </figure>

      <figure>
        <img
          src="images/cocora.jpg"
          alt="Palmas de cera entre las montañas del Valle de Cocora"
        />
        <figcaption>
          <h2>Valle de Cocora</h2>
          <p>
            Un paisaje natural del Quindío caracterizado por sus altas palmas de
            cera y montañas verdes.
          </p>
        </figcaption>
      </figure>

      <figure>
        <img
          src="images/tayrona.jpg"
          alt="Playa rodeada de vegetación en el Parque Tayrona"
        />
        <figcaption>
          <h2>Parque Tayrona</h2>
          <p>
            Este parque combina playas, senderos, vegetación tropical y paisajes
            del mar Caribe.
          </p>
        </figcaption>
      </figure>

      <figure>
        <img
          src="images/monserrate.jpg"
          alt="Vista panorámica de Bogotá desde Monserrate"
        />
        <figcaption>
          <h2>Monserrate</h2>
          <p>
            Desde la montaña de Monserrate se puede observar una amplia vista de
            Bogotá y sus alrededores.
          </p>
        </figcaption>
      </figure>

      <figure>
        <img
          src="images/santander.jpg"
          alt="Montañas y cañón natural en Santander"
        />
        <figcaption>
          <h2>Santander</h2>
          <p>
            Sus montañas y cañones ofrecen escenarios ideales para conocer la
            naturaleza y practicar aventura.
          </p>
        </figcaption>
      </figure>

      <figure>
        <img
          src="images/san-andres.jpg"
          alt="Playa de arena clara y mar azul en San Andrés"
        />
        <figcaption>
          <h2>San Andrés</h2>
          <p>
            La isla se destaca por sus playas y por las diferentes tonalidades
            azules de su mar.
          </p>
        </figcaption>
      </figure>

      <figure>
        <img
          src="images/cano-cristales.jpg"
          alt="Río de colores rodeado de vegetación en Caño Cristales"
        />
        <figcaption>
          <h2>Caño Cristales</h2>
          <p>
            Este río es reconocido por los colores que adquieren sus plantas
            acuáticas durante determinadas temporadas.
          </p>
        </figcaption>
      </figure>

      <figure>
        <img
          src="images/villa-de-leyva.jpg"
          alt="Plaza empedrada y edificios coloniales en Villa de Leyva"
        />
        <figcaption>
          <h2>Villa de Leyva</h2>
          <p>
            Sus calles empedradas, su plaza principal y sus construcciones
            conservan un ambiente colonial.
          </p>
        </figcaption>
      </figure>
    </main>

    <footer>
      <a class="volver" href="#inicio">Volver al principio</a>
      <p>Sitio responsivo creado con HTML y CSS.</p>
    </footer>
  </body>
</html>
